# ==============================================================================
# Judge0 Configuration File
# ==============================================================================

# Server configuration
RESTART_MAX_TRIES=10
MAINTENANCE_MODE=false
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
ENABLE_COMMAND_LINE_ARGUMENTS=true
ENABLE_SUBMISSION_DELETE=false
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=20
ENABLE_CALLBACKS=false
SUBMISSION_CACHE_DURATION=0
USE_DOCS_AS_HOMEPAGE=true

# Isolate cgroups configuration
# CRITICAL: Judge0 1.13.0 on Docker Desktop (WSL2/cgroup v2)
# isolate_job.rb logic: if EITHER per-process setting is false → uses --cg (cgroup v1) → FAILS!
# Both MUST be true to use RLIMIT mode (no cgroups needed).
# RLIMIT_AS limits VIRTUAL memory, so limits must be high enough for JVM/V8 mmap.
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true

# Default and max resource limits
# RLIMIT_AS = virtual memory → JVM needs ~1GB virtual for 256MB heap
CPU_TIME_LIMIT=10
MAX_CPU_TIME_LIMIT=30
WALL_TIME_LIMIT=20
MAX_WALL_TIME_LIMIT=60
MEMORY_LIMIT=512000
MAX_MEMORY_LIMIT=2048000

# Database credentials (PostgreSQL)
POSTGRES_USER=postgres
POSTGRES_DB=judge0
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_PASSWORD=aispeis_password_2026

# Cache credentials (Redis)
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=aispeis_password_2026
REDIS_URL=redis://:aispeis_password_2026@redis:6379/0

# Sandbox isolation settings
# Disallow enabling network access inside submissions to ensure complete isolation
ALLOW_ENABLE_NETWORK=false

# Worker settings
# Number of queue workers
WORKERS=4
