version: '3.8'

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: judge0/judge0:1.13.0
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    environment:
      - REDIS_PASSWORD=aispeis_password_2026
      - POSTGRES_PASSWORD=aispeis_password_2026
    depends_on:
      - db
      - redis
    <<: *default-logging

  worker:
    image: judge0/judge0:1.13.0
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always
    environment:
      - REDIS_PASSWORD=aispeis_password_2026
      - POSTGRES_PASSWORD=aispeis_password_2026
    depends_on:
      - db
      - redis
    <<: *default-logging

  db:
    image: postgres:16.2
    env_file: judge0.conf
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=judge0
      - POSTGRES_PASSWORD=aispeis_password_2026
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    restart: always
    <<: *default-logging

  redis:
    image: redis:7.2.4
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "aispeis_password_2026"']
    env_file: judge0.conf
    restart: always
    <<: *default-logging

volumes:
  postgres-data:
